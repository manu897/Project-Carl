# Carl room-node firmware on the Nordic Thingy:53.
#
# Mirrors firmware/node-sensor/prj.conf wherever it can (BT broadcaster,
# settings/NVS, mbedtls) so the hub decodes both nodes with the same code
# path. Where it differs: enables the Thingy:53's onboard BME688 + BH1749
# sensors, and skips the BME280 / VEML7700 drivers used by the XIAO probe.

# --- Bluetooth (broadcaster only — never connects, just emits BTHome ads) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="carl-room"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y

# --- Sensors ---
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_BME680=y          # Zephyr's bme680 driver covers the BME688 part on Thingy:53
CONFIG_BH1749=y          # NCS driver for the Rohm BH1749 RGB/ambient light sensor

# --- Persistence (AES key + counter via settings_nvs) ---
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- RNG for AES key generation on first boot ---
CONFIG_ENTROPY_GENERATOR=y

# --- mbedtls (AES-CCM-128 for BTHome encryption) ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=4096
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_CCM_ENABLED=y

# --- C++17 to match the shared firmware/common headers ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_MAIN=y
CONFIG_LIB_CPLUSPLUS=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# --- PWM (buzzer on pwm1 + RGB LED on pwm0) ---
CONFIG_PWM=y

# --- Float support for printk (BME688 / BH1749 readings) ---
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Logging (off by default to save power; flip to y temporarily with
# CONFIG_BT_LOG_LEVEL_DBG=y to diagnose BT host issues during bring-up.) ---
CONFIG_LOG=n
CONFIG_PRINTK=y
