# Cheap profile overlay — bare XIAO nRF52840 / future custom PCB.
# Build with: west build -b xiao_ble -- -DEXTRA_CONF_FILE=prj_cheap.conf

CONFIG_CARL_CHEAP_PROFILE=y

# Tighter stacks; no display / UI tasks.
CONFIG_MAIN_STACK_SIZE=1536

# Dev-mode soil recalibration over the serial console (opt-in, default off in
# Kconfig). Flip CONFIG_CARL_DEV_CAL=y on the build line to enable the CAL
# DRY/WET/SAVE/SHOW commands; the console subsystem below backs console_getline().
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y
