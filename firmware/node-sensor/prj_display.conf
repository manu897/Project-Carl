# Display profile overlay — XIAO nRF52840 + XIAO Expansion Board.
# Build with: west build -b xiao_ble -- -DEXTRA_CONF_FILE=prj_display.conf

CONFIG_CARL_DISPLAY_PROFILE=y

# OLED on the expansion board (SSD1306, I2C)
CONFIG_DISPLAY=y
CONFIG_SSD1306=y

# GPIO for button + buzzer
CONFIG_GPIO=y
CONFIG_PWM=y

# Slightly more RAM/stack headroom for the UI rendering paths.
CONFIG_MAIN_STACK_SIZE=2048
