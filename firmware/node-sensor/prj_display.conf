# Display profile overlay — XIAO nRF52840 + XIAO Expansion Board.
# Build with: west build -b xiao_ble -- -DEXTRA_CONF_FILE=prj_display.conf

CONFIG_CARL_DISPLAY_PROFILE=y

# OLED on the expansion board (SSD1306, I2C).
CONFIG_DISPLAY=y
CONFIG_SSD1306=y

# Character framebuffer for simple text-only OLED rendering — no LVGL needed.
CONFIG_CHARACTER_FRAMEBUFFER=y

# GPIO for the user button + PWM for the buzzer.
CONFIG_GPIO=y
CONFIG_PWM=y

# Slightly more headroom for the UI rendering paths.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
