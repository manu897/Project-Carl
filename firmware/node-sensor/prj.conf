# Common config for both display and cheap profiles.
# Profile-specific overrides live in prj_display.conf / prj_cheap.conf.

# --- Bluetooth (peripheral, broadcast) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="carl-node"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y

# --- Sensors ---
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_BME280=y
CONFIG_VEML7700=y

# --- Power management ---
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# --- Persistence (calibration, AES key, counter, thresholds) ---
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- RNG for AES key generation on first boot ---
CONFIG_ENTROPY_GENERATOR=y

# --- mbedtls (legacy API; AES-CCM used by firmware/common/bthome/aes_ccm.cpp) ---
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=4096
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_CCM_ENABLED=y

# --- C++17 for shared firmware/common headers + the application code ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_MAIN=y

# --- Logging (off by default to save power; enable in debug builds) ---
CONFIG_LOG=n
CONFIG_PRINTK=y
