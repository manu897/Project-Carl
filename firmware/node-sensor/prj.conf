# Common config for both display and cheap profiles.
# Profile-specific overrides live in prj_display.conf / prj_cheap.conf.

# --- Bluetooth (peripheral, broadcast) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="carl-node"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_EXT_ADV=n
# Manufacturer / service-data set dynamically per advertisement.

# --- Sensors ---
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_BME280=y
CONFIG_VEML7700=y

# --- Power management ---
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# --- Persistence (calibration, AES key, counter) ---
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Crypto for BTHome v2 AES-CCM ---
CONFIG_NRF_SECURITY=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_AES_KEY_SIZE_128=y

# --- Logging (off by default to save power; enable in a debug overlay) ---
CONFIG_LOG=n
CONFIG_PRINTK=y

# --- C++ for shared firmware/common headers ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
