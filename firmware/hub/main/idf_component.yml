# ESP-IDF managed components.
# `idf.py reconfigure` resolves these from the Espressif Component Registry.
#
# - mdns moved out of core IDF in v5.0 and is now distributed as a managed
#   component. Required for advertising _carl-hub._tcp on the LAN.
#
# joltwallet/littlefs gets added back here in Phase 3e when we wire the
# web dashboard onto the LittleFS partition.
dependencies:
  espressif/mdns: "^1.4.0"
