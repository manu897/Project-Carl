; Carl reader node on M5Stack M5Paper.
;
; A premium-tier Wi-Fi client of the Carl hub: polls
;   http://carl-hub.local/api/nodes
; on a slow cadence (every ~5 min, e-paper-friendly), renders the per-plant
; cards on the 4.7" e-paper, accepts touch input. Same OpenAPI contract the
; iOS app uses, so it's a drop-in alternative reader for users who want a
; kitchen-counter dashboard instead of opening their phone.
;
; The hub remains the single owner of BLE scanning, AES key storage, and
; cloud handoff — the M5Paper is a thin client. No keys live here.

[env:m5paper]
platform = espressif32@^6.5.0
board = m5stack-fire           ; closest in-tree board; M5Paper-specific via flags
framework = arduino
monitor_speed = 115200

; Pin the M5Paper's USB port so PlatformIO doesn't accidentally grab a
; co-resident ESP32 hub or XIAO sensor on the same machine.
; The M5Paper's CH9102 always enumerates as /dev/cu.usbserial-XXXXXXXX.
; XIAO BLE shows up as /dev/cu.usbmodem... (native USB CDC) — never use
; that here. Run `pio device list` to find your specific suffix.
upload_port  = /dev/cu.usbserial-*
monitor_port = /dev/cu.usbserial-*

board_build.partitions = no_ota.csv
board_build.psram_type = qspi
build_flags =
    -DCARL_READER_M5PAPER
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_M5Stack_Paper
    ; Local timezone for the dashboard clock (POSIX TZ string). Default is UK
    ; (GMT/BST). Change to your zone, e.g. US Eastern:
    ;   -DCARL_READER_TZ='"EST5EDT,M3.2.0,M11.1.0"'
    ; Central Europe: -DCARL_READER_TZ='"CET-1CEST,M3.5.0,M10.5.0/3"'
    -DCARL_READER_TZ='"GMT0BST,M3.5.0/1,M10.5.0"'

lib_extra_dirs =
    ../common

lib_deps =
    https://github.com/m5stack/M5EPD.git
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
